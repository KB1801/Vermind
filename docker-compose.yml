version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: verimind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: verimind_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verimind_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - VERIMIND_OFFLINE_MODE=false
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_storage: