apiVersion: apps/v1
kind: Deployment
metadata:
  name: verimind-backend
  namespace: verimind
  labels:
    app: verimind-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verimind-backend
  template:
    metadata:
      labels:
        app: verimind-backend
    spec:
      containers:
      - name: verimind-app
        image: verimind-backend:v2.2.0
        ports:
        - containerPort: 8000
        env:
        - name: VERIMIND_OFFLINE_MODE
          value: "false"
        - name: QDRANT_URL
          value: "http://qdrant-service:6333"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/admin/status
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: verimind-service
  namespace: verimind
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: verimind-backend